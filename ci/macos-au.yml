name: macOS AU (build + auval)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-au-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # -eo pipefail

jobs:
  au:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      COMPONENT: build/plugin/PitchLane_artefacts/Release/AU/PitchLane.component
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sw_vers
          xcodebuild -version
          command -v ninja || brew install ninja
          cmake --version

      - name: Configure (Release, universal arm64 + x86_64)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DPITCHLANE_STANDALONE=ON

      - name: Build AU + Standalone + tests
        run: cmake --build build --target PitchLane_AU PitchLane_Standalone pitchlane_core_tests PitchLaneTests

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Inspect bundle
        run: |
          ls -la "$COMPONENT/Contents/MacOS"
          lipo -info "$COMPONENT/Contents/MacOS/PitchLane"
          lipo -info "$COMPONENT/Contents/MacOS/PitchLane" | grep -q arm64
          lipo -info "$COMPONENT/Contents/MacOS/PitchLane" | grep -q x86_64
          plutil -p "$COMPONENT/Contents/Info.plist" | grep -A12 AudioComponents

      - name: Ad-hoc sign + install to ~/Library/Audio/Plug-Ins/Components
        run: |
          codesign --force --deep -s - "$COMPONENT"
          codesign -dv "$COMPONENT" 2>&1 | head -5
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/PitchLane.component
          cp -R "$COMPONENT" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2

      - name: auval -v aufx Plne Pk20
        run: |
          auval -a | grep -i "Plne" || (echo "Pitch Lane not listed by auval -a"; auval -a | tail -20)
          set +e
          auval -v aufx Plne Pk20 | tee auval.log
          status=${PIPESTATUS[0]}
          set -e
          grep -q "AU VALIDATION SUCCEEDED" auval.log || { echo "::error::auval failed (exit $status)"; exit 1; }
          [ "$status" -eq 0 ] || { echo "::error::auval exit code $status"; exit 1; }

      - name: auval -strict (informational)
        continue-on-error: true
        run: auval -strict -v aufx Plne Pk20 | tail -40

      - name: Zip component
        if: always()
        run: |
          if [ -d "$COMPONENT" ]; then
            ditto -c -k --keepParent "$COMPONENT" PitchLane-AU-macOS-universal.zip
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PitchLane-AU-macOS-universal
          path: |
            PitchLane-AU-macOS-universal.zip
            auval.log
          if-no-files-found: warn
